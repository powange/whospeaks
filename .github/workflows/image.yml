name: Image

# Construit et publie l'image sur GHCR, puis avance la branche `deploy` suivie par Portainer.
# La branche n'avance qu'une fois l'image publiée : Portainer ne voit jamais un commit
# dont l'image n'existe pas encore. Le workflow ne se déclenche pas sur `deploy` (pas de boucle).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # pousser la branche deploy
  packages: write   # publier sur ghcr.io

# Deux pushs rapprochés : on annule la construction la plus ancienne, pour qu'elle ne
# remette pas `latest` et `deploy` sur un commit plus vieux en finissant après l'autre.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/powange/whospeaks

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Tests
        run: |
          pip install -e '.[test]'
          pytest -q

      # Publication seulement depuis main (un workflow_dispatch sur une autre branche
      # ne fait que les tests).
      - uses: docker/setup-buildx-action@v4
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avancer la branche deploy
        if: github.ref == 'refs/heads/main'
        run: git push --force origin HEAD:deploy

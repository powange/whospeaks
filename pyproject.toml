[project]
name = "whospeaks"
version = "0.2.1"
description = "Reconnaissance du locuteur pour Home Assistant (proxy STT Wyoming)"
requires-python = ">=3.11"
dependencies = [
    "wyoming>=1.6",
    "sherpa-onnx>=1.10",
    "numpy>=1.26",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
whospeaks = "whospeaks.__main__:main"
whospeaks-evaluate = "whospeaks.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whospeaks*"]

[tool.setuptools.package-data]
whospeaks = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
